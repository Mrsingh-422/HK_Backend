<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Kangaroo | Email Password Reset Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .step-bubble.active { @apply bg-emerald-600 text-white shadow-lg shadow-emerald-200 border-emerald-600; }
        .step-bubble.completed { @apply bg-slate-900 text-white border-slate-900; }
        .step-bubble { @apply w-10 h-10 rounded-2xl flex items-center justify-center font-black border-2 border-slate-200 text-slate-400 transition-all; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-white p-8 sm:p-10 rounded-[2.5rem] shadow-2xl border border-slate-100 space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-50 text-emerald-600 rounded-3xl text-2xl shadow-inner mb-2">
                <i class="fas fa-envelope-open-text"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800 tracking-tight">Email Reset Test</h2>
            <p class="text-xs text-slate-400 font-medium">Verify Email OTP & Reset Password</p>
        </div>

        <!-- Stepper -->
        <div class="flex items-center justify-between px-4">
            <div class="flex flex-col items-center gap-1">
                <div id="bubble1" class="step-bubble active">1</div>
                <span class="text-[9px] font-black uppercase text-slate-500">Email</span>
            </div>
            <div id="line1" class="h-1 flex-grow bg-slate-100 mx-2 rounded-full"></div>
            <div class="flex flex-col items-center gap-1">
                <div id="bubble2" class="step-bubble">2</div>
                <span class="text-[9px] font-black uppercase text-slate-500">Verify</span>
            </div>
            <div id="line2" class="h-1 flex-grow bg-slate-100 mx-2 rounded-full"></div>
            <div class="flex flex-col items-center gap-1">
                <div id="bubble3" class="step-bubble">3</div>
                <span class="text-[9px] font-black uppercase text-slate-500">New Pass</span>
            </div>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="hidden p-4 rounded-2xl text-xs font-bold transition-all"></div>

        <!-- STEP 1: Enter Email -->
        <div id="step1Box" class="space-y-4">
            <div>
                <label class="text-xs font-bold text-slate-400 uppercase">Registered Email Address</label>
                <input id="emailInput" type="email" placeholder="aapka_email@gmail.com" class="w-full mt-2 bg-slate-50 border-none rounded-2xl p-4 font-bold text-slate-700 outline-none text-sm">
            </div>
            <button id="sendEmailBtn" onclick="handleSendEmailOtp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-xl shadow-emerald-100 transition-all flex items-center justify-center gap-2 text-sm">
                <i class="fas fa-paper-plane"></i> Send 6-Digit Email OTP
            </button>
        </div>

        <!-- STEP 2: Enter OTP -->
        <div id="step2Box" class="hidden space-y-4">
            <div class="text-center p-3 bg-slate-50 rounded-2xl">
                <p class="text-xs text-slate-500">OTP sent to: <b id="displayEmail" class="text-slate-800 font-mono"></b></p>
            </div>
            <div>
                <label class="text-xs font-bold text-slate-400 uppercase">Enter 6-Digit OTP</label>
                <input id="otpInput" type="text" maxlength="6" placeholder="• • • • • •" class="w-full mt-2 bg-slate-50 border border-slate-200 rounded-2xl p-4 font-black text-center text-2xl tracking-[0.5em] text-slate-800 outline-none">
            </div>
            <button id="verifyOtpBtn" onclick="handleVerifyEmailOtp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-xl shadow-emerald-100 transition-all flex items-center justify-center gap-2 text-sm">
                <i class="fas fa-shield-check"></i> Verify OTP
            </button>
        </div>

        <!-- STEP 3: Enter New Password -->
        <div id="step3Box" class="hidden space-y-4">
            <div>
                <label class="text-xs font-bold text-slate-400 uppercase">New Password</label>
                <input id="newPassInput" type="password" placeholder="Min. 6 characters" class="w-full mt-2 bg-slate-50 border-none rounded-2xl p-4 font-bold text-slate-700 outline-none text-sm">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-400 uppercase">Confirm Password</label>
                <input id="confirmPassInput" type="password" placeholder="Re-enter password" class="w-full mt-2 bg-slate-50 border-none rounded-2xl p-4 font-bold text-slate-700 outline-none text-sm">
            </div>
            <button id="resetPassBtn" onclick="handleResetPassword()" class="w-full bg-slate-900 hover:bg-black text-white font-black py-4 rounded-2xl shadow-xl transition-all flex items-center justify-center gap-2 text-sm">
                <i class="fas fa-check-circle"></i> Update Password
            </button>
        </div>

    </div>

    <script>
        const baseUrl = "http://localhost:5002";
        let targetEmail = "";

        function showAlert(msg, isError = false) {
            const box = document.getElementById('alertBox');
            box.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-emerald-50', 'text-emerald-600');
            box.classList.add(isError ? 'bg-red-50' : 'bg-emerald-50', isError ? 'text-red-600' : 'text-emerald-600');
            box.innerHTML = `<i class="fas ${isError ? 'fa-circle-exclamation' : 'fa-check-circle'} mr-2"></i> ${msg}`;
        }

        function goToStep(step) {
            document.getElementById('step1Box').classList.toggle('hidden', step !== 1);
            document.getElementById('step2Box').classList.toggle('hidden', step !== 2);
            document.getElementById('step3Box').classList.toggle('hidden', step !== 3);

            const b1 = document.getElementById('bubble1');
            const b2 = document.getElementById('bubble2');
            const b3 = document.getElementById('bubble3');
            const l1 = document.getElementById('line1');
            const l2 = document.getElementById('line2');

            b1.className = step > 1 ? 'step-bubble completed' : 'step-bubble active';
            b2.className = step === 2 ? 'step-bubble active' : (step > 2 ? 'step-bubble completed' : 'step-bubble');
            b3.className = step === 3 ? 'step-bubble active' : 'step-bubble';

            l1.className = step > 1 ? 'h-1 flex-grow bg-emerald-500 mx-2 rounded-full' : 'h-1 flex-grow bg-slate-100 mx-2 rounded-full';
            l2.className = step > 2 ? 'h-1 flex-grow bg-emerald-500 mx-2 rounded-full' : 'h-1 flex-grow bg-slate-100 mx-2 rounded-full';
        }

        // 1. Send OTP
        async function handleSendEmailOtp() {
            const email = document.getElementById('emailInput').value.trim();
            const btn = document.getElementById('sendEmailBtn');

            if (!email || !email.includes('@')) {
                showAlert("Please enter a valid email address.", true);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sending Email...`;

            try {
                const res = await fetch(`${baseUrl}/api/password/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error(data.message || "Failed to send OTP.");
                }

                targetEmail = email;
                document.getElementById('displayEmail').innerText = email;
                showAlert(data.message + (data.testOtp ? ` (DEV OTP: ${data.testOtp})` : ''));
                goToStep(2);

            } catch (err) {
                showAlert(err.message, true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-paper-plane"></i> Send 6-Digit Email OTP`;
            }
        }

        // 2. Verify OTP
        async function handleVerifyEmailOtp() {
            const otp = document.getElementById('otpInput').value.trim();
            const btn = document.getElementById('verifyOtpBtn');

            if (!otp || otp.length !== 6) {
                showAlert("Please enter 6-digit OTP.", true);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Verifying...`;

            try {
                const res = await fetch(`${baseUrl}/api/password/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: targetEmail, otp })
                });

                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error(data.message || "Invalid OTP.");
                }

                showAlert("OTP Verified! Enter your new password.");
                goToStep(3);

            } catch (err) {
                showAlert(err.message, true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-shield-check"></i> Verify OTP`;
            }
        }

        // 3. Reset Password
        async function handleResetPassword() {
            const newPassword = document.getElementById('newPassInput').value;
            const confirmPassword = document.getElementById('confirmPassInput').value;
            const btn = document.getElementById('resetPassBtn');

            if (!newPassword || newPassword.length < 6) {
                showAlert("Password must be at least 6 characters long.", true);
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert("Passwords do not match.", true);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Updating...`;

            try {
                const res = await fetch(`${baseUrl}/api/password/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: targetEmail,
                        newPassword,
                        confirmPassword
                    })
                });

                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error(data.message || "Failed to update password.");
                }

                showAlert("Password Updated Successfully! You can now login.");
                setTimeout(() => window.location.reload(), 2000);

            } catch (err) {
                showAlert(err.message, true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-check-circle"></i> Update Password`;
            }
        }
    </script>
</body>
</html>
