<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Kangaroo | Patient Registration</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- 🔥 Firebase Client SDKs (Compat Version for Web) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .hk-input-box { @apply flex items-center gap-3 border border-gray-200 bg-white rounded-2xl px-5 py-4 transition-all focus-within:border-emerald-600 focus-within:ring-2 focus-within:ring-emerald-100; }
        .hk-input { @apply w-full bg-transparent font-medium text-slate-800 outline-none text-sm placeholder-gray-400; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Invisible Firebase Recaptcha Container -->
    <div id="recaptcha-container"></div>

    <div class="w-full max-w-md bg-white p-8 sm:p-10 rounded-[2.5rem] shadow-2xl border border-slate-100 space-y-6 my-6">
        
        <!-- Header & Logo -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-emerald-50 text-emerald-600 rounded-3xl text-3xl mb-1 shadow-inner">
                <i class="fas fa-shield-heart"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800 tracking-tight">Health Kangaroo</h2>
            <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider">One-Stop Healthcare Solution</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="hidden p-4 rounded-2xl text-xs font-bold transition-all"></div>

        <!-- FORM CONTAINER -->
        <div class="space-y-4">
            
            <!-- 1. Full Name -->
            <div class="hk-input-box">
                <i class="far fa-user text-gray-400 text-lg"></i>
                <input id="userName" type="text" placeholder="Pankaj Kumar" class="hk-input">
            </div>

            <!-- 2. Email Address -->
            <div class="hk-input-box">
                <i class="far fa-envelope text-gray-400 text-lg"></i>
                <input id="userEmail" type="email" placeholder="omninos@gmail.com" class="hk-input">
            </div>

            <!-- 3. Phone Number with Verified Badge / Send OTP Button -->
            <div class="hk-input-box relative">
                <i class="fas fa-phone-alt text-gray-400 text-sm"></i>
                <input id="userPhone" type="tel" placeholder="+91 0000000000" class="hk-input font-bold text-slate-700">
                
                <!-- Unverified State: Send OTP Button -->
                <button id="sendOtpBtn" onclick="handleSendOtp()" type="button" class="text-xs font-bold text-emerald-600 bg-emerald-50 hover:bg-emerald-100 px-3.5 py-1.5 rounded-xl whitespace-nowrap transition flex items-center gap-1.5">
                    <span>Verify</span>
                </button>

                <!-- Verified State: Figma Green Badge (Hidden initially) -->
                <span id="verifiedBadge" class="hidden text-xs font-bold text-emerald-600 bg-emerald-50 px-3.5 py-1.5 rounded-xl whitespace-nowrap">
                    | Verified
                </span>
            </div>

            <!-- OTP Input Box (Revealed when OTP is sent) -->
            <div id="otpBox" class="hidden space-y-2 p-4 bg-emerald-50/50 rounded-2xl border border-emerald-200">
                <p class="text-[11px] font-bold text-emerald-800 uppercase tracking-wide">Enter Firebase SMS OTP</p>
                <div class="flex gap-2">
                    <input id="userOtp" type="text" maxlength="6" placeholder="• • • • • •" class="w-full bg-white border border-emerald-300 rounded-xl px-4 py-2.5 font-black text-center text-lg tracking-widest outline-none text-slate-800">
                    <button id="confirmOtpBtn" onclick="handleConfirmOtp()" type="button" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl whitespace-nowrap shadow-md transition">
                        Confirm
                    </button>
                </div>
            </div>

            <!-- 4. Country Dropdown -->
            <div class="hk-input-box">
                <span class="text-base">🇮🇳</span>
                <select id="userCountry" class="hk-input font-bold text-slate-700">
                    <option value="India">India</option>
                </select>
            </div>

            <!-- 5. State Dropdown -->
            <div class="hk-input-box">
                <i class="far fa-building text-gray-400 text-base"></i>
                <select id="userState" class="hk-input font-bold text-slate-700">
                    <option value="Punjab">Punjab</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Haryana">Haryana</option>
                </select>
            </div>

            <!-- 6. City Dropdown -->
            <div class="hk-input-box">
                <i class="far fa-city text-gray-400 text-base"></i>
                <select id="userCity" class="hk-input font-bold text-slate-700">
                    <option value="Mohali">Mohali</option>
                    <option value="Chandigarh">Chandigarh</option>
                    <option value="Panchkula">Panchkula</option>
                </select>
            </div>

            <!-- 7. Password -->
            <div class="hk-input-box">
                <i class="fas fa-lock text-gray-400 text-base"></i>
                <input id="userPassword" type="password" placeholder="Create Password" class="hk-input">
            </div>

            <!-- Terms and Conditions Checkbox -->
            <div class="flex items-start gap-3 pt-2">
                <input id="termsCheckbox" type="checkbox" checked class="mt-1 w-4 h-4 text-emerald-600 rounded border-gray-300 focus:ring-emerald-500">
                <label for="termsCheckbox" class="text-xs text-slate-500 font-medium leading-relaxed">
                    I accept the Health Kangaroo <a href="#" class="text-emerald-600 font-bold underline">Term of use</a> & <a href="#" class="text-emerald-600 font-bold underline">Privacy Policy</a>.
                </label>
            </div>

            <!-- Submit Button (Figma: CREATE PASSWORD) -->
            <button id="registerBtn" onclick="handleUserRegistration()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-xl shadow-emerald-200 transition-all uppercase tracking-wide text-sm flex items-center justify-center gap-2 mt-4">
                <i class="fas fa-user-plus"></i> Create Account
            </button>

            <!-- Footer Link -->
            <p class="text-center text-xs text-slate-500 font-medium pt-2">
                Have an account? <a href="#" class="text-emerald-600 font-bold underline">Login</a>
            </p>
        </div>

    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        const baseUrl = "http://localhost:5002";

        // =========================================================================
        // 🚨 1. PASTE YOUR FIREBASE WEB CONFIG HERE
        // (Firebase Console -> Project Settings -> General -> Web App)
        // =========================================================================
         const firebaseConfig = {
  apiKey: "AIzaSyA4Jszsbc3SUkdWl6kK0WDQLgmwY7s7u3g",
  authDomain: "hk-frontend-5b02d.firebaseapp.com",
  projectId: "hk-frontend-5b02d",
  storageBucket: "hk-frontend-5b02d.firebasestorage.app",
  messagingSenderId: "296544053183",
  appId: "1:296544053183:web:b1f5fd36dc74645216230a",
  measurementId: "G-SE1W23VBXV"
};

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // State
        let confirmationResult = null;
        let verifiedIdToken = null;
        let appVerifier = null;

        function showAlert(msg, isError = false) {
            const box = document.getElementById('alertBox');
            box.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-emerald-50', 'text-emerald-600');
            box.classList.add(isError ? 'bg-red-50' : 'bg-emerald-50', isError ? 'text-red-600' : 'text-emerald-600');
            box.innerHTML = `<i class="fas ${isError ? 'fa-circle-exclamation' : 'fa-check-circle'} mr-2"></i> ${msg}`;
        }

        // =========================================================================
        // 📱 1. PRE-CHECK IN DB + SEND REAL SMS OTP VIA FIREBASE
        // =========================================================================
        async function handleSendOtp() {
            let phone = document.getElementById('userPhone').value.trim();
            let email = document.getElementById('userEmail').value.trim();
            const btn = document.getElementById('sendOtpBtn');

            if (!phone || phone.replace(/\D/g, "").length < 10) {
                showAlert("Please enter a valid 10-digit mobile number.", true);
                return;
            }

            const cleanDigits = phone.replace(/\D/g, "").slice(-10);
            const fullPhone = `+91${cleanDigits}`;

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Checking...`;

            try {
                // 🚨 1. PEHLE BACKEND CHECK KAREGA (Kya number already exist karta hai?)
                const checkRes = await fetch(`${baseUrl}/api/auth/user/check-exists`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: cleanDigits, email: email || undefined })
                });

                const checkData = await checkRes.json();

                // Agar number pehle se exist karta hai, toh yahin rok do! (OTP nahi jayega)
                if (checkData.exists) {
                    showAlert(checkData.message, true);
                    btn.disabled = false;
                    btn.innerText = "Verify";
                    return;
                }

                // 🚨 2. AGAR NUMBER NEW HAI, TABHI FIREBASE SMS OTP BHEJO
                btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sending OTP...`;

                if (!appVerifier) {
                    appVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' });
                }

                confirmationResult = await firebase.auth().signInWithPhoneNumber(fullPhone, appVerifier);
                
                showAlert("SMS OTP sent to " + fullPhone);
                document.getElementById('otpBox').classList.remove('hidden');

            } catch (err) {
                console.error("Error:", err);
                showAlert(err.message || "Failed to process request.", true);
                if (appVerifier) appVerifier.render().then(id => grecaptcha.reset(id));
            } finally {
                btn.disabled = false;
                btn.innerText = "Resend";
            }
        }

        // =========================================================================
        // 🔢 2. CONFIRM OTP & SHOW FIGMA VERIFIED BADGE
        // =========================================================================
        async function handleConfirmOtp() {
            const otp = document.getElementById('userOtp').value.trim();
            const confirmBtn = document.getElementById('confirmOtpBtn');

            if (!otp || otp.length !== 6) {
                showAlert("Please enter a valid 6-digit OTP code.", true);
                return;
            }

            confirmBtn.disabled = true;
            confirmBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i>`;

            try {
                const userCredential = await confirmationResult.confirm(otp);
                verifiedIdToken = await userCredential.user.getIdToken();

                // Hide OTP box & Send button, Show Figma green badge!
                document.getElementById('otpBox').classList.add('hidden');
                document.getElementById('sendOtpBtn').classList.add('hidden');
                document.getElementById('verifiedBadge').classList.remove('hidden');
                document.getElementById('userPhone').readOnly = true;

                showAlert("Phone number verified successfully!");

            } catch (err) {
                console.error("OTP Error:", err);
                showAlert(err.message || "Invalid or Expired OTP.", true);
            } finally {
                confirmBtn.disabled = false;
                confirmBtn.innerText = "Confirm";
            }
        }

        // =========================================================================
        // 🚀 3. REGISTER USER (CALL BACKEND API)
        // =========================================================================
        async function handleUserRegistration() {
            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const phone = document.getElementById('userPhone').value.trim().replace(/\D/g, "").slice(-10);
            const country = document.getElementById('userCountry').value;
            const state = document.getElementById('userState').value;
            const city = document.getElementById('userCity').value;
            const password = document.getElementById('userPassword').value;
            const termsAccepted = document.getElementById('termsCheckbox').checked;

            if (!name || !phone || !password) {
                showAlert("Please fill Full Name, Mobile Number, and Password!", true);
                return;
            }

            if (password.length < 6) {
                showAlert("Password must be at least 6 characters long.", true);
                return;
            }

            if (!termsAccepted) {
                showAlert("Please accept the Terms & Privacy Policy.", true);
                return;
            }

            const regBtn = document.getElementById('registerBtn');
            regBtn.disabled = true;
            regBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Creating Account...`;

            try {
                const payload = {
                    name,
                    email: email || undefined,
                    phone,
                    countryCode: "+91",
                    country,
                    state,
                    city,
                    password,
                    idToken: verifiedIdToken // 👈 Verified Firebase token sent to backend
                };

                const res = await fetch(`${baseUrl}/api/auth/user/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (!res.ok || !data.success) {
                    throw new Error(data.message || "Registration failed.");
                }

                showAlert("Account Created Successfully! Welcome to Health Kangaroo.");
                setTimeout(() => {
                    alert(`Registration Complete!\nWelcome, ${data.user.name}\nLocation: ${data.user.location}\nToken: ${data.token.substring(0, 25)}...`);
                    window.location.reload();
                }, 1500);

            } catch (err) {
                console.error("Register Error:", err);
                showAlert(err.message || "Registration failed.", true);
            } finally {
                regBtn.disabled = false;
                regBtn.innerHTML = `<i class="fas fa-user-plus mr-2"></i> Create Account`;
            }
        }
    </script>
</body>
</html>
