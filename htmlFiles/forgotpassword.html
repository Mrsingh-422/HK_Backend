<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Kangaroo | Secure Password Reset</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- 🔥 Firebase Client SDKs (Compat Version for Web) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .step-bubble.active { @apply bg-red-600 text-white shadow-lg shadow-red-200 border-red-600; }
        .step-bubble.completed { @apply bg-green-600 text-white border-green-600; }
        .step-bubble { @apply w-10 h-10 rounded-2xl flex items-center justify-center font-black border-2 border-slate-200 text-slate-400 transition-all; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <!-- Invisible Firebase Recaptcha Container -->
    <div id="recaptcha-container"></div>

    <div class="w-full max-w-xl bg-white p-10 rounded-[2.5rem] shadow-2xl border border-slate-100 space-y-8">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-red-50 text-red-600 rounded-3xl text-2xl shadow-inner mb-2">
                <i class="fas fa-key"></i>
            </div>
            <h2 class="text-3xl font-black text-slate-800 tracking-tight">Reset Password</h2>
            <p class="text-xs text-slate-400 font-medium">Verify your registered phone number with Firebase OTP</p>
        </div>

        <!-- Stepper -->
        <div class="flex items-center justify-between px-4">
            <div class="flex flex-col items-center gap-1.5">
                <div id="bubble1" class="step-bubble active">1</div>
                <span class="text-[10px] font-black uppercase text-slate-500">Phone</span>
            </div>
            <div id="line1" class="h-1 flex-grow bg-slate-100 mx-3 rounded-full"></div>
            <div class="flex flex-col items-center gap-1.5">
                <div id="bubble2" class="step-bubble">2</div>
                <span class="text-[10px] font-black uppercase text-slate-500">Verify OTP</span>
            </div>
            <div id="line2" class="h-1 flex-grow bg-slate-100 mx-3 rounded-full"></div>
            <div class="flex flex-col items-center gap-1.5">
                <div id="bubble3" class="step-bubble">3</div>
                <span class="text-[10px] font-black uppercase text-slate-500">New Password</span>
            </div>
        </div>

        <!-- Notification Banner -->
        <div id="alertBox" class="hidden p-4 rounded-2xl text-xs font-bold transition-all"></div>

        <!-- ========================================== -->
        <!-- 📱 STEP 1: PHONE INPUT & ROLE SELECTION -->
        <!-- ========================================== -->
        <div id="step1Container" class="space-y-6">
            <div>
                <label class="text-xs font-bold text-slate-400 uppercase">Registered Phone Number</label>
                <div class="flex gap-3 mt-2">
                    <input id="countryCodeInput" type="text" value="+91" class="w-24 bg-slate-50 border-none rounded-2xl p-4 font-bold text-slate-700 outline-none text-center">
                    <input id="phoneInput" type="tel" placeholder="9876543210" class="flex-grow bg-slate-50 border-none rounded-2xl p-4 font-bold text-slate-700 outline-none">
                </div>
            </div>

            <!-- Role Selector (Auto populated if multiple accounts found) -->
            <div id="roleSelectorBox" class="hidden space-y-2">
                <label class="text-xs font-bold text-slate-400 uppercase">Select Target Account / Role</label>
                <select id="roleSelect" class="w-full bg-slate-50 border-none rounded-2xl p-4 font-bold text-slate-700 outline-none">
                </select>
            </div>

            <button id="sendOtpBtn" onclick="handleSendOtp()" class="w-full bg-red-600 text-white font-black py-5 rounded-[2rem] shadow-xl shadow-red-100 hover:bg-red-700 transition-all flex items-center justify-center gap-3">
                <i class="fas fa-paper-plane"></i> Send Firebase SMS OTP
            </button>
        </div>

        <!-- ========================================== -->
        <!-- 🔢 STEP 2: ENTER OTP -->
        <!-- ========================================== -->
        <div id="step2Container" class="hidden space-y-6">
            <div class="text-center p-4 bg-slate-50 rounded-2xl">
                <p class="text-xs text-slate-500 font-medium">6-digit verification code sent to</p>
                <p id="displayTargetPhone" class="text-sm font-black text-slate-800 font-mono mt-1">+91 XXXXXXXXXX</p>
            </div>

            <div>
                <label class="text-xs font-bold text-slate-400 uppercase">Enter SMS OTP</label>
                <input id="otpInput" type="text" maxlength="6" placeholder="• • • • • •" class="w-full mt-2 bg-slate-50 border border-slate-200 rounded-2xl p-4 font-black text-center text-2xl tracking-[0.5em] text-slate-800 outline-none">
            </div>

            <button id="verifyOtpBtn" onclick="handleVerifyOtp()" class="w-full bg-red-600 text-white font-black py-5 rounded-[2rem] shadow-xl shadow-red-100 hover:bg-red-700 transition-all flex items-center justify-center gap-3">
                <i class="fas fa-shield-check"></i> Verify OTP & Proceed
            </button>

            <button onclick="goToStep(1)" class="w-full text-slate-400 text-xs font-bold hover:text-slate-600 transition">
                <i class="fas fa-arrow-left"></i> Change Phone Number
            </button>
        </div>

        <!-- ========================================== -->
        <!-- 🔒 STEP 3: NEW PASSWORD -->
        <!-- ========================================== -->
        <div id="step3Container" class="hidden space-y-6">
            <div>
                <label class="text-xs font-bold text-slate-400 uppercase">New Password</label>
                <input id="newPasswordInput" type="password" placeholder="Min. 6 characters" class="w-full mt-2 bg-slate-50 border-none rounded-2xl p-4 font-bold text-slate-700 outline-none">
            </div>

            <div>
                <label class="text-xs font-bold text-slate-400 uppercase">Confirm Password</label>
                <input id="confirmPasswordInput" type="password" placeholder="Re-enter password" class="w-full mt-2 bg-slate-50 border-none rounded-2xl p-4 font-bold text-slate-700 outline-none">
            </div>

            <button id="resetPassBtn" onclick="handleResetPassword()" class="w-full bg-green-600 text-white font-black py-5 rounded-[2rem] shadow-xl shadow-green-100 hover:bg-green-700 transition-all flex items-center justify-center gap-3">
                <i class="fas fa-check-circle"></i> Update Password
            </button>
        </div>

    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        const baseUrl = "http://localhost:5002";

        // =========================================================================
        // 🚨 1. PASTE YOUR FIREBASE WEB CONFIG HERE
        // (Firebase Console -> Project Settings -> General -> Your Apps -> Web App)
        // =========================================================================
        const firebaseConfig = {
  apiKey: "AIzaSyA4Jszsbc3SUkdWl6kK0WDQLgmwY7s7u3g",
  authDomain: "hk-frontend-5b02d.firebaseapp.com",
  projectId: "hk-frontend-5b02d",
  storageBucket: "hk-frontend-5b02d.firebasestorage.app",
  messagingSenderId: "296544053183",
  appId: "1:296544053183:web:b1f5fd36dc74645216230a",
  measurementId: "G-SE1W23VBXV"
};

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // Global State
        let confirmationResult = null;
        let backendResetToken = null;
        let selectedPhone = "";
        let selectedRole = "";
        let appVerifier = null;

        // UI Helpers
        function showAlert(msg, isError = false) {
            const box = document.getElementById('alertBox');
            box.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-green-50', 'text-green-600');
            box.classList.add(isError ? 'bg-red-50' : 'bg-green-50', isError ? 'text-red-600' : 'text-green-600');
            box.innerHTML = `<i class="fas ${isError ? 'fa-circle-exclamation' : 'fa-check-circle'} mr-2"></i> ${msg}`;
        }

        function goToStep(step) {
            document.getElementById('step1Container').classList.toggle('hidden', step !== 1);
            document.getElementById('step2Container').classList.toggle('hidden', step !== 2);
            document.getElementById('step3Container').classList.toggle('hidden', step !== 3);

            const b1 = document.getElementById('bubble1');
            const b2 = document.getElementById('bubble2');
            const b3 = document.getElementById('bubble3');
            const l1 = document.getElementById('line1');
            const l2 = document.getElementById('line2');

            b1.className = step > 1 ? 'step-bubble completed' : 'step-bubble active';
            b2.className = step === 2 ? 'step-bubble active' : (step > 2 ? 'step-bubble completed' : 'step-bubble');
            b3.className = step === 3 ? 'step-bubble active' : 'step-bubble';

            l1.className = step > 1 ? 'h-1 flex-grow bg-green-500 mx-3 rounded-full' : 'h-1 flex-grow bg-slate-100 mx-3 rounded-full';
            l2.className = step > 2 ? 'h-1 flex-grow bg-green-500 mx-3 rounded-full' : 'h-1 flex-grow bg-slate-100 mx-3 rounded-full';
        }

        // =========================================================================
        // 🚀 STEP 1: SEND OTP (BACKEND CHECK + FIREBASE TRIGGER)
        // =========================================================================
        async function handleSendOtp() {
            const code = document.getElementById('countryCodeInput').value.trim();
            const phone = document.getElementById('phoneInput').value.trim();
            const btn = document.getElementById('sendOtpBtn');

            if (!phone || phone.length < 10) {
                showAlert("Please enter a valid 10-digit phone number.", true);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Checking Account & Sending OTP...`;

            try {
                // 1. Call Backend to check registered roles
                const checkRes = await fetch(`${baseUrl}/api/password/forgot-password-phone`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });

                const checkData = await checkRes.json();
                if (!checkRes.ok || !checkData.success) {
                    throw new Error(checkData.message || "Account check failed.");
                }

                // Populate Role Selector if multiple accounts exist
                const roleSelect = document.getElementById('roleSelect');
                roleSelect.innerHTML = checkData.accounts.map(acc => 
                    `<option value="${acc.role}">${acc.name} (${acc.role}) - ${acc.maskedEmail}</option>`
                ).join('');

                if (checkData.accounts.length > 1) {
                    document.getElementById('roleSelectorBox').classList.remove('hidden');
                }
                selectedRole = checkData.accounts[0].role;
                selectedPhone = phone;

                // 2. Initialize Firebase Invisible Recaptcha
                if (!appVerifier) {
                    appVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                        size: 'invisible'
                    });
                }

                // 3. Trigger Firebase SMS
                const fullPhone = `${code}${phone}`;
                confirmationResult = await firebase.auth().signInWithPhoneNumber(fullPhone, appVerifier);

                document.getElementById('displayTargetPhone').innerText = fullPhone;
                showAlert("OTP sent successfully to your mobile number!");
                goToStep(2);

            } catch (err) {
                console.error("Firebase/Backend Error:", err);
                showAlert(err.message || "Failed to send SMS OTP.", true);
                if (appVerifier) {
                    appVerifier.render().then(widgetId => grecaptcha.reset(widgetId));
                }
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-paper-plane"></i> Send Firebase SMS OTP`;
            }
        }

        // =========================================================================
        // 🚀 STEP 2: VERIFY OTP (FIREBASE ID TOKEN -> BACKEND RESET TOKEN)
        // =========================================================================
        async function handleVerifyOtp() {
            const otp = document.getElementById('otpInput').value.trim();
            const btn = document.getElementById('verifyOtpBtn');

            if (!otp || otp.length !== 6) {
                showAlert("Please enter a valid 6-digit OTP code.", true);
                return;
            }

            const roleDropdown = document.getElementById('roleSelect');
            if (!document.getElementById('roleSelectorBox').classList.contains('hidden')) {
                selectedRole = roleDropdown.value;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Verifying with Firebase...`;

            try {
                // 1. Confirm OTP with Firebase Client SDK
                const userCredential = await confirmationResult.confirm(otp);
                const idToken = await userCredential.user.getIdToken();

                // 2. Send idToken to Backend to get Reset Token
                const verifyRes = await fetch(`${baseUrl}/api/password/verify-firebase-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phone: selectedPhone,
                        idToken: idToken,
                        selectedRole: selectedRole
                    })
                });

                const verifyData = await verifyRes.json();
                if (!verifyRes.ok || !verifyData.success) {
                    throw new Error(verifyData.message || "Backend verification failed.");
                }

                backendResetToken = verifyData.resetToken;
                showAlert("OTP Verified Successfully! Now set your new password.");
                goToStep(3);

            } catch (err) {
                console.error("Verification Error:", err);
                showAlert(err.message || "Invalid or Expired OTP.", true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-shield-check"></i> Verify OTP & Proceed`;
            }
        }

        // =========================================================================
        // 🚀 STEP 3: SUBMIT NEW PASSWORD (USING BACKEND RESET TOKEN)
        // =========================================================================
        async function handleResetPassword() {
            const newPassword = document.getElementById('newPasswordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value;
            const btn = document.getElementById('resetPassBtn');

            if (!newPassword || newPassword.length < 6) {
                showAlert("Password must be at least 6 characters long.", true);
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert("Passwords do not match.", true);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Updating Password...`;

            try {
                const resetRes = await fetch(`${baseUrl}/api/password/reset-password-phone`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phone: selectedPhone,
                        resetToken: backendResetToken,
                        selectedRole: selectedRole,
                        newPassword: newPassword,
                        confirmPassword: confirmPassword
                    })
                });

                const resetData = await resetRes.json();
                if (!resetRes.ok || !resetData.success) {
                    throw new Error(resetData.message || "Failed to update password.");
                }

                showAlert("Password Reset Successful! You can now login with your new password.");
                setTimeout(() => {
                    alert("Password reset completed successfully!");
                    window.location.reload();
                }, 1500);

            } catch (err) {
                console.error("Reset Password Error:", err);
                showAlert(err.message || "Failed to reset password.", true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-check-circle"></i> Update Password`;
            }
        }
    </script>
</body>
</html>
