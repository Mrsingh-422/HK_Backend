<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Phone OTP Test Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-lg shadow-md max-w-md w-full border border-gray-200 space-y-6">
        <div>
            <h1 class="text-2xl font-bold text-indigo-600 mb-1">Universal Password Reset</h1>
            <p class="text-xs text-gray-400">Firebase SMS multi-profile password reset console</p>
        </div>

        <div id="alertBox" class="hidden px-4 py-2.5 rounded text-sm font-semibold transition-all duration-300"></div>

        <!-- PHASE 1: CHECK PHONE IN DATABASE -->
        <div id="step1-container" class="space-y-3">
            <span class="text-2xs font-bold text-gray-400 uppercase block tracking-wider">Step 1: Check Account Phone</span>
            <div class="flex space-x-2">
                <input type="text" id="phoneNumber" placeholder="e.g. +919876543210" class="flex-1 border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="checkPhoneInDb()" id="checkBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-sm font-medium transition">Check</button>
            </div>
        </div>

        <!-- reCAPTCHA Container (Required by Firebase) -->
        <div id="recaptcha-container" class="hidden mb-4"></div>

        <!-- 🚨 MULTI-PROFILE SELECTOR CONTAINER (Visible if phone exists) -->
        <div id="profileSelectorContainer" class="hidden border-t pt-4 space-y-3">
            <span class="text-2xs font-bold text-gray-400 uppercase block tracking-wider">Select the Profile to Reset</span>
            <div id="profilesList" class="space-y-2">
                <!-- Radio buttons will render here dynamically -->
            </div>
        </div>

        <!-- PHASE 2: SEND & VERIFY FIREBASE OTP -->
        <div id="step2-container" class="hidden space-y-4 border-t pt-4">
            <span class="text-2xs font-bold text-gray-400 uppercase block tracking-wider">Step 2: Firebase OTP Verification</span>
            
            <div class="flex items-center justify-between bg-indigo-50 p-2 rounded text-xs text-indigo-700">
                <span id="targetPhoneLabel"></span>
                <button onclick="sendOTP()" id="sendBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded text-2xs transition">Send SMS OTP</button>
            </div>

            <div id="otpInputSection" class="hidden space-y-2">
                <label class="block text-3xs font-bold text-gray-400 uppercase">Verification Code</label>
                <div class="flex space-x-2">
                    <input type="text" id="verificationCode" placeholder="6-digit code" class="flex-1 border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="verifyCode()" id="verifyBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm font-medium transition">Verify OTP</button>
                </div>
            </div>
        </div>

        <!-- TARGET PROFILE CARD -->
        <div id="accountProfileCard" class="hidden border-t pt-4 space-y-2">
            <span class="text-2xs font-bold text-gray-400 uppercase block tracking-wider">Target Profile Account Info</span>
            <div class="bg-green-50 border border-green-150 p-4 rounded-lg space-y-1 text-xs text-green-800">
                <div>• Name: <b id="profileName" class="text-green-900"></b></div>
                <div>• Role/Model Category: <b id="profileRole" class="text-green-900"></b></div>
                <div>• Registered Email: <b id="profileEmail" class="text-green-900"></b></div>
            </div>
        </div>

        <!-- PHASE 3: ENTER NEW PASSWORD -->
        <div id="step3-container" class="hidden space-y-4 border-t pt-4">
            <span class="text-2xs font-bold text-gray-400 uppercase block tracking-wider">Step 3: Choose New Password</span>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-3xs font-bold text-gray-400 uppercase mb-1">New Password</label>
                    <input type="password" id="newPassword" placeholder="Minimum 6 characters" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-3xs font-bold text-gray-400 uppercase mb-1">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-type password" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button onclick="executePasswordReset()" id="resetBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded text-sm transition">Reset Password</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
  apiKey: "AIzaSyA4Jszsbc3SUkdWl6kK0WDQLgmwY7s7u3g",
  authDomain: "hk-frontend-5b02d.firebaseapp.com",
  projectId: "hk-frontend-5b02d",
  storageBucket: "hk-frontend-5b02d.firebasestorage.app",
  messagingSenderId: "296544053183",
  appId: "1:296544053183:web:b1f5fd36dc74645216230a",
  measurementId: "G-SE1W23VBXV"
};

        firebase.initializeApp(firebaseConfig);
        
        window.onload = function() {
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                'size': 'invisible', 
                'callback': (response) => {
                    console.log("reCAPTCHA solved.");
                }
            });
            window.recaptchaVerifier.render();
        };

        let tempResetToken = ""; 

        // 1. Step 1: Check phone in DB and render dynamic Radio list of accounts
        async function checkPhoneInDb() {
            const phone = document.getElementById('phoneNumber').value;
            if (!phone) return showAlert("Phone number is required", "error");

            document.getElementById('checkBtn').innerText = "Checking...";

            try {
                const response = await fetch('/api/password/forgot-password-phone', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });

                const result = await response.json();

                if (result.success && result.accounts) {
                    showAlert(`${result.accounts.length} profile(s) found! Select one.`, "success");
                    
                    const listContainer = document.getElementById('profilesList');
                    
                    // Render Radio buttons dynamically
                    listContainer.innerHTML = result.accounts.map((acc, idx) => `
                        <label class="flex items-center space-x-3 p-3 bg-gray-50 border rounded-lg cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition">
                            <input type="radio" name="selectedRole" value="${acc.role}" ${idx === 0 ? 'checked' : ''} class="h-4 w-4 text-indigo-600 focus:ring-indigo-500">
                            <div class="text-xs">
                                <div class="font-bold text-gray-800">${acc.name}</div>
                                <div class="text-gray-500">Role: <span class="font-semibold text-indigo-600">${acc.role}</span> • Email: ${acc.email}</div>
                            </div>
                        </label>
                    `).join('');

                    document.getElementById('profileSelectorContainer').classList.remove('hidden');
                    document.getElementById('targetPhoneLabel').innerText = phone;
                    document.getElementById('step2-container').classList.remove('hidden');
                    document.getElementById('recaptcha-container').classList.remove('hidden');
                } else {
                    showAlert(result.message || "Account not found.", "error");
                }
            } catch (error) {
                showAlert("Server connection failed.", "error");
            } finally {
                document.getElementById('checkBtn').innerText = "Check";
            }
        }

        // Send OTP
        function sendOTP() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            const appVerifier = window.recaptchaVerifier;
            
            document.getElementById('sendBtn').innerText = "Sending...";
            
            firebase.auth().signInWithPhoneNumber(phoneNumber, appVerifier)
                .then((confirmationResult) => {
                    window.confirmationResult = confirmationResult;
                    document.getElementById('sendBtn').innerText = "Sent";
                    document.getElementById('otpInputSection').classList.remove('hidden');
                    showAlert("SMS OTP dispatched!", "success");
                }).catch((error) => {
                    console.error("SMS Error:", error);
                    showAlert("Error: " + error.message, "error");
                    document.getElementById('sendBtn').innerText = "Send SMS OTP";
                });
        }

        // 2. Step 2: Verify Code and pass 'selectedRole' to generate target resetToken
        function verifyCode() {
            const code = document.getElementById('verificationCode').value;
            const phone = document.getElementById('phoneNumber').value;
            
            // Get selected radio value
            const selectedRoleElement = document.querySelector('input[name="selectedRole"]:checked');
            if (!selectedRoleElement) return showAlert("Please select a profile first.", "error");
            const selectedRole = selectedRoleElement.value;

            if (!code) return alert("Please enter the 6-digit code.");

            document.getElementById('verifyBtn').innerText = "Verifying...";

            window.confirmationResult.confirm(code)
                .then((result) => {
                    return result.user.getIdToken();
                }).then(async (idToken) => {
                    // Passes 'selectedRole' in body
                    const backendResponse = await fetch('/api/password/verify-firebase-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone, idToken, selectedRole })
                    });

                    const backendResult = await backendResponse.json();

                    if (backendResult.success) {
                        tempResetToken = backendResult.resetToken; 
                        document.getElementById('verifyBtn').innerText = "Verified";
                        showAlert("Verification successful! Step 3 unlocked.", "success");
                        
                        document.getElementById('profileName').innerText = backendResult.accountInfo.name;
                        document.getElementById('profileRole').innerText = backendResult.accountInfo.role;
                        document.getElementById('profileEmail').innerText = backendResult.accountInfo.email;
                        document.getElementById('accountProfileCard').classList.remove('hidden');

                        document.getElementById('step3-container').classList.remove('hidden');
                    } else {
                        showAlert("Backend verification failed: " + backendResult.message, "error");
                        document.getElementById('verifyBtn').innerText = "Verify OTP";
                    }
                }).catch((error) => {
                    console.error("Verification Error:", error);
                    showAlert("Verification Failed: " + error.message, "error");
                    document.getElementById('verifyBtn').innerText = "Verify OTP";
                });
        }

        // 3. Step 3: Reset password for selectedRole
        async function executePasswordReset() {
            const phone = document.getElementById('phoneNumber').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const selectedRoleElement = document.querySelector('input[name="selectedRole"]:checked');
            if (!selectedRoleElement) return showAlert("Please select a profile.", "error");
            const selectedRole = selectedRoleElement.value;

            if (!newPassword || newPassword !== confirmPassword) {
                return showAlert("Passwords do not match.", "error");
            }

            document.getElementById('resetBtn').innerText = "Resetting...";

            try {
                // Passes 'selectedRole' in body
                const response = await fetch('/api/password/reset-password-phone', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phone,
                        resetToken: tempResetToken, 
                        selectedRole,
                        newPassword,
                        confirmPassword
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showAlert("Password reset successfully! You can login now.", "success");
                    setTimeout(() => {
                        window.location.reload(); 
                    }, 3500);
                } else {
                    showAlert(result.message || "Reset failed.", "error");
                }
            } catch (error) {
                showAlert("Reset submission failed.", "error");
            } finally {
                document.getElementById('resetBtn').innerText = "Reset Password";
            }
        }

        function showAlert(msg, statusType) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerText = msg;
            alertBox.className = `block px-4 py-2.5 rounded text-sm font-semibold transition-all duration-300 ${
                statusType === 'success' ? 'bg-green-100 text-green-800 border border-green-200' : 'bg-red-100 text-red-800 border border-red-200'
            }`;
        }
    </script>
</body>
</html>
