<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Kangaroo - Doctor Booking Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #00B377; --brand-light: #E6F7F1; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFB; }
        .app-container { max-width: 450px; margin: 0 auto; background: white; min-height: 100vh; position: relative; box-shadow: 0 0 100px rgba(0,0,0,0.1); }
        .screen { display: none; padding-bottom: 100px; }
        .screen.active { display: block; }
        .btn-brand { background-color: var(--brand); color: white; border-radius: 16px; font-weight: 700; }
        .figma-card { background: white; border-radius: 24px; border: 1px solid #F1F5F9; transition: all 0.2s; cursor: pointer; }
        .figma-card:hover { border-color: var(--brand); }
        .type-btn.active { background-color: var(--brand-light); border-color: var(--brand); color: var(--brand); }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- AUTH & LOCATION SETTER -->
    <div class="p-4 bg-gray-900 text-white text-[10px] space-y-2">
        <input type="text" id="token-input" placeholder="Paste User JWT Token Here" class="w-full bg-gray-800 p-2 rounded border border-gray-700">
        <div class="flex gap-2">
            <input type="text" id="user-lat" value="30.7046" placeholder="User Lat" class="w-1/2 bg-gray-800 p-2 rounded border border-gray-700">
            <input type="text" id="user-lng" value="76.7179" placeholder="User Lng" class="w-1/2 bg-gray-800 p-2 rounded border border-gray-700">
        </div>
    </div>

    <!-- SCREEN 12: SPECIALIST SELECTION -->
    <div id="screen-12" class="screen active p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black">Book a Doctor</h2>
            <span class="text-gray-400 text-sm flex items-center"><i data-lucide="map-pin" class="w-4 h-4 mr-1"></i> Mohali</span>
        </div>

        <!-- Consultation Type Selector (FIGMA) -->
        <div class="grid grid-cols-3 gap-3 mb-8">
            <button onclick="setType('Video Consult', this)" class="type-btn figma-card p-4 text-center">
                <i data-lucide="video" class="mx-auto mb-2"></i>
                <span class="text-[10px] font-bold">Video</span>
            </button>
            <button onclick="setType('Clinic Visit', this)" class="type-btn figma-card p-4 text-center">
                <i data-lucide="hospital" class="mx-auto mb-2"></i>
                <span class="text-[10px] font-bold">Clinic</span>
            </button>
            <button onclick="setType('Home Visit', this)" class="type-btn figma-card p-4 text-center active">
                <i data-lucide="home" class="mx-auto mb-2"></i>
                <span class="text-[10px] font-bold">Home</span>
            </button>
        </div>

        <h3 class="font-bold mb-4">Find a specialist</h3>
        <div id="specialization-grid" class="grid grid-cols-3 gap-4 mb-8"></div>

        <h3 class="font-bold mb-4">Available Doctors (Near You)</h3>
        <div id="doctor-list" class="space-y-4"></div>
    </div>

    <!-- Other Screens (13, 15, 19, 22) -->
    <div id="screen-13" class="screen p-6">
        <button onclick="goBack('screen-12')" class="mb-4"><i data-lucide="chevron-left"></i></button>
        <div id="profile-content"></div>
        <button onclick="showSlots()" class="btn-brand w-full py-4 mt-6">Book Appointment</button>
    </div>

    <div id="screen-15" class="screen p-6">
        <button onclick="goBack('screen-13')" class="mb-4"><i data-lucide="chevron-left"></i></button>
        <h2 class="text-xl font-bold mb-6">Select Date & Time</h2>
        <input type="date" id="appointment-date" class="w-full p-4 mb-6 border rounded-2xl" onchange="loadSlots()">
        <div id="slots-container" class="grid grid-cols-3 gap-3"></div>
        <button onclick="showSummary()" class="btn-brand w-full py-4 mt-8">Continue</button>
    </div>

    <div id="screen-19" class="screen p-6">
        <h2 class="text-xl font-bold mb-6">Review Appointment</h2>
        <div id="summary-card" class="figma-card p-6 space-y-4"></div>
        <button onclick="processBooking()" class="btn-brand w-full py-4 mt-8">Proceed to Pay</button>
    </div>

    <div id="screen-22" class="screen">
        <div class="h-64 bg-gray-200 flex items-center justify-center">
            <p class="font-bold text-gray-500">[ TRACKING MAP VIEW ]</p>
        </div>
        <div class="p-6 bg-white rounded-t-[40px] -mt-10 relative">
            <div id="tracking-info" class="text-center">
                <p class="text-brand font-bold uppercase text-xs">Dr. Amina on the way</p>
                <h3 class="text-3xl font-black my-2">12 min <span class="text-sm font-normal text-gray-400">ETA</span></h3>
                <div class="bg-brand-light p-4 rounded-2xl border-2 border-dashed border-brand my-4">
                    <p class="text-[10px] text-gray-500">Start Visit OTP</p>
                    <h1 id="tracking-otp" class="text-2xl font-black tracking-widest text-brand">----</h1>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:5002/user/doctors";
    let selectedType = 'Home Visit';
    let selectedDoctor = null;
    let selectedSlot = null;

    async function callApi(path, method = 'GET', body = null) {
        const token = document.getElementById('token-input').value;
        const options = {
            method,
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            }
        };
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(`${API_BASE}${path}`, options);
        return await res.json();
    }

    function navigate(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        lucide.createIcons();
    }

    function goBack(id) { navigate(id); }

    // --- UPDATED: Load Doctors via POST with Location ---
    async function loadDoctors() {
        const uLat = document.getElementById('user-lat').value;
        const uLng = document.getElementById('user-lng').value;

        // Calling POST /list
        const res = await callApi('/list', 'POST', {
            consultationType: selectedType,
            userLat: uLat,
            userLng: uLng
        });

        const list = document.getElementById('doctor-list');
        if(!res.data) return list.innerHTML = "No doctors found.";

        list.innerHTML = res.data.map(doc => `
            <div class="figma-card p-4 flex gap-4" onclick="loadDoctorProfile('${doc._id}')">
                <img src="http://localhost:5002/${doc.profileImage}" class="w-16 h-16 rounded-2xl bg-gray-100 object-cover">
                <div class="flex-1">
                    <h4 class="font-black text-sm">${doc.name}</h4>
                    <p class="text-[10px] text-gray-400">${doc.speciality}</p>
                    
                    <!-- DISTANCE DISPLAY (NEW) -->
                    <p class="text-[10px] text-orange-600 font-black mt-1">
                        <i data-lucide="navigation" class="inline w-3 h-3"></i> ${doc.distance} km away
                    </p>

                    <div class="flex items-center gap-2 mt-1">
                         <span class="bg-green-100 text-green-600 text-[8px] px-2 py-1 rounded-full">Available now</span>
                         <span class="text-[10px] font-bold text-brand">₹${doc.fees.home || doc.fees.clinic}</span>
                    </div>
                </div>
            </div>
        `).join('');
        lucide.createIcons();
    }

    // --- Selection Logic ---
    async function loadInitialData() {
        const specs = await callApi('/specializations');
        if(specs.data) {
            document.getElementById('specialization-grid').innerHTML = specs.data.slice(0, 6).map(s => `
                <div class="text-center p-2"><div class="w-12 h-12 bg-green-50 rounded-2xl mx-auto flex items-center justify-center mb-1"><i data-lucide="stethoscope" class="text-brand w-5 h-5"></i></div><span class="text-[9px] font-bold text-gray-600">${s.name}</span></div>
            `).join('');
        }
        loadDoctors();
    }

    async function setType(type, btn) {
        selectedType = type;
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadDoctors();
    }

    async function loadDoctorProfile(id) {
        const res = await callApi(`/details/${id}`);
        selectedDoctor = res.data.profile;
        document.getElementById('profile-content').innerHTML = `
            <div class="text-center mb-6">
                <img src="http://localhost:5002/${selectedDoctor.profileImage}" class="w-32 h-32 rounded-[40px] mx-auto mb-4 border-4 border-brand-light object-cover">
                <h2 class="text-2xl font-black">${selectedDoctor.name}</h2>
                <p class="text-gray-400">${selectedDoctor.speciality}</p>
            </div>
            <div class="figma-card p-4 mb-4">
                <h4 class="font-bold text-xs mb-2">About Doctor</h4>
                <p class="text-[10px] text-gray-500 leading-relaxed">${selectedDoctor.about || 'Specialist doctor'}</p>
            </div>
        `;
        navigate('screen-13');
    }

    function showSlots() {
        document.getElementById('appointment-date').value = moment().format('YYYY-MM-DD');
        loadSlots();
        navigate('screen-15');
    }

    async function loadSlots() {
        const date = document.getElementById('appointment-date').value;
        const res = await callApi(`/slots/${selectedDoctor._id}?date=${date}`);
        document.getElementById('slots-container').innerHTML = res.slots.map(s => `
            <button onclick="selectSlot('${s.time}')" class="p-3 figma-card text-[10px] font-bold ${s.available ? '' : 'opacity-30 pointer-events-none'} ${selectedSlot === s.time ? 'border-brand text-brand bg-green-50' : ''}">
                ${s.time} ${s.premiumFee > 0 ? `<br><span class="text-orange-500 font-black">+₹${s.premiumFee}</span>` : ''}
            </button>
        `).join('');
    }

    function selectSlot(time) { selectedSlot = time; loadSlots(); }

    async function showSummary() {
        const res = await callApi('/checkout-summary', 'POST', {
            doctorId: selectedDoctor._id,
            consultationType: selectedType,
            timeSlot: selectedSlot,
            distance: 8.5 // Simulated for summary
        });
        const d = res.data;
        document.getElementById('summary-card').innerHTML = `
            <div class="flex justify-between text-sm"><span>Base Fee</span><span>₹${d.baseFee}</span></div>
            <div class="flex justify-between text-sm"><span>Visit Charge</span><span>₹${d.visitCharge}</span></div>
            <div class="flex justify-between text-sm"><span>Premium Slot</span><span>₹${d.premiumFee}</span></div>
            <hr><div class="flex justify-between font-black text-xl text-brand"><span>To Pay</span><span>₹${d.totalPayable}</span></div>
        `;
        navigate('screen-19');
    }

    async function processBooking() {
        const res = await callApi('/book', 'POST', {
            doctorId: selectedDoctor._id,
            consultationType: selectedType,
            appointmentDate: document.getElementById('appointment-date').value,
            appointmentTime: selectedSlot,
            patients: [{ patientName: "Rahul", patientAge: 24 }],
            pricing: { totalPayable: 900, baseFee: 800, visitCharge: 50, premiumFee: 50, subtotal: 900 }
        });
        if (res.success) {
            document.getElementById('tracking-otp').innerText = res.data.tracking.otp;
            navigate('screen-22');
        }
    }

    window.onload = loadInitialData;
</script>
</body>
</html>
