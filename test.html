<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Booking Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .slot-btn { margin: 5px; width: 80px; }
        .available { background-color: #d1e7dd; border: 1px solid #0f5132; }
        .disabled-slot { background-color: #f8d7da; border: 1px solid #842029; cursor: not-allowed; }
        .doctor-card { cursor: pointer; transition: 0.3s; }
        .doctor-card:hover { box-shadow: 0 0 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="text-center mb-4">Book Your Appointment</h2>

    <!-- Step 1: Specialization -->
    <div class="row mb-4">
        <div class="col-md-6 offset-md-3">
            <select id="specSelect" class="form-select" onchange="fetchDoctors()">
                <option value="">Select Specialization</option>
            </select>
        </div>
    </div>

    <!-- Step 2: Doctor List -->
    <div id="doctorList" class="row"></div>

    <!-- Step 3: Slots -->
    <div id="slotSection" class="mt-4 p-4 bg-white shadow rounded d-none">
        <h4>Available Slots for <span id="docNameDisplay"></span></h4>
        <div id="slotsContainer" class="d-flex flex-wrap mt-3"></div>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:5002"; // Update this
    let selectedDoctorId = null;

    // 1. Load Specializations
    async function loadSpecializations() {
        const res = await fetch(`${API_BASE}/user/doctors/specializations`);
        const data = await res.json();
        const select = document.getElementById('specSelect');
        data.data.forEach(s => {
            select.innerHTML += `<option value="${s.name}">${s.name}</option>`;
        });
    }

    // 2. Fetch Doctors based on Speciality
    async function fetchDoctors() {
        const spec = document.getElementById('specSelect').value;
        const res = await fetch(`${API_BASE}/user/doctors/list?speciality=${spec}`);
        const data = await res.json();
        const container = document.getElementById('doctorList');
        container.innerHTML = '';
        
        data.data.forEach(doc => {
            container.innerHTML += `
                <div class="col-md-4 mb-3">
                    <div class="card doctor-card p-3" onclick="selectDoctor('${doc._id}', '${doc.name}')">
                        <h5>${doc.name}</h5>
                        <p class="text-muted">${doc.city} | Fees: ₹${doc.fees.clinic}</p>
                    </div>
                </div>`;
        });
    }

    // 3. Select Doctor & Get Slots
    async function selectDoctor(id, name) {
        selectedDoctorId = id;
        document.getElementById('docNameDisplay').innerText = name;
        document.getElementById('slotSection').classList.remove('d-none');
        
        const date = "2026-05-20"; // Aaj ki ya desired date
        const res = await fetch(`${API_BASE}/user/doctors/slots/${id}?date=${date}`, {
            headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        const data = await res.json();
        
        const container = document.getElementById('slotsContainer');
        container.innerHTML = '';
        
        data.slots.forEach(slot => {
            container.innerHTML += `
                <button class="btn ${slot.available ? 'available' : 'disabled-slot'} slot-btn" 
                        ${!slot.available ? 'disabled' : ''} 
                        onclick="bookAppointment('${slot.time}')">
                    ${slot.time}
                </button>`;
        });
    }

    // 4. Final Booking Function
    async function bookAppointment(time) {
        const payload = {
            doctorId: selectedDoctorId,
            appointmentDate: '2026-05-20',
            appointmentTime: time,
            consultationType: 'Clinic Visit',
            patients: [{ patientName: 'Self', patientAge: 25, gender: 'Male', isMainUser: true }],
            pricing: { baseFee: 221, visitCharges: 0, subtotal: 221, totalAmount: 221 }
        };

        const res = await fetch(`${API_BASE}/user/doctors/book`, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('token')}` 
            },
            body: JSON.stringify(payload)
        });

        const result = await res.json();
        if(result.success) {
            alert("Booking Successful! ID: " + result.bookingId);
        } else {
            alert("Error: " + result.message);
        }
    }

    loadSpecializations();
</script>
</body>
</html>
