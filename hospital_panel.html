<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Master Panel - Health Kangaroo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #00B377; --brand-light: #E6F7F1; }
        body { background-color: #F8FAFB; font-family: 'Plus Jakarta Sans', sans-serif; }
        .figma-card { background: white; border-radius: 28px; border: 1px solid #F1F5F9; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.04); transition: 0.3s; }
        .sidebar-link.active { background: var(--brand-light); color: var(--brand); font-weight: 800; border-right: 4px solid var(--brand); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .btn-action { background: var(--brand); color: white; border-radius: 14px; font-weight: 700; padding: 10px 20px; transition: 0.3s; }
        .btn-action:active { transform: scale(0.95); }
        .modal-backdrop { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .bed-box { aspect-ratio: 1/1; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 10px; border: 2px solid #EEE; }
        .bed-Available { background: #E6F7F1; border-color: #00B377; color: #00B377; }
        .bed-Occupied { background: #FFEBEE; border-color: #FF5252; color: #FF5252; }
        .bed-Reserved { background: #FFF3E0; border-color: #FF9800; color: #FF9800; }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- 1. SIDEBAR -->
    <aside class="w-72 bg-white border-r sticky top-0 h-screen flex flex-col p-6 z-50">
        <div class="flex items-center gap-3 mb-10 px-2">
            <div class="w-10 h-10 bg-green-600 rounded-2xl flex items-center justify-center text-white shadow-lg">
                <i data-lucide="hospital"></i>
            </div>
            <h1 class="text-xl font-black tracking-tighter uppercase">Radius <span class="text-green-600">Hospital</span></h1>
        </div>

        <nav class="flex-1 space-y-2 no-scrollbar overflow-y-auto">
            <button onclick="switchTab('dashboard', this)" class="sidebar-link active flex items-center gap-4 w-full p-4 rounded-2xl transition"><i data-lucide="layout-grid"></i> Dashboard</button>
            <button onclick="switchTab('emergency', this)" class="sidebar-link flex items-center gap-4 w-full p-4 rounded-2xl transition"><i data-lucide="alert-circle"></i> Emergency Case</button>
            <button onclick="switchTab('wards', this)" class="sidebar-link flex items-center gap-4 w-full p-4 rounded-2xl transition"><i data-lucide="bed"></i> Manage Wards</button>
            <button onclick="switchTab('admissions', this)" class="sidebar-link flex items-center gap-4 w-full p-4 rounded-2xl transition"><i data-lucide="users"></i> Admissions</button>
            <button onclick="switchTab('referrals', this)" class="sidebar-link flex items-center gap-4 w-full p-4 rounded-2xl transition"><i data-lucide="truck"></i> Referrals / Fleet</button>
            <button onclick="switchTab('services', this)" class="sidebar-link flex items-center gap-4 w-full p-4 rounded-2xl transition"><i data-lucide="plus-square"></i> Services</button>
            <button onclick="switchTab('ratings', this)" class="sidebar-link flex items-center gap-4 w-full p-4 rounded-2xl transition"><i data-lucide="star"></i> Ratings</button>
            <button onclick="switchTab('settings', this)" class="sidebar-link flex items-center gap-4 w-full p-4 rounded-2xl transition"><i data-lucide="settings"></i> Settings</button>
        </nav>

        <div class="mt-auto border-t pt-4">
            <button onclick="logout()" class="flex items-center gap-4 w-full p-4 rounded-2xl text-red-500 font-bold hover:bg-red-50 transition"><i data-lucide="log-out"></i> Logout</button>
        </div>
    </aside>

    <!-- 2. MAIN CONTENT AREA -->
    <main class="flex-1 p-10 overflow-x-hidden">
        
        <header class="flex justify-between items-center mb-10">
            <div>
                <h2 id="tab-title" class="text-3xl font-black text-slate-800 tracking-tight">Dashboard Overview</h2>
                <p class="text-slate-400 text-sm font-medium mt-1 uppercase tracking-widest">Real-time Node: http://localhost:5002</p>
            </div>
            <button onclick="loadStats()" class="bg-white border p-3 rounded-2xl shadow-sm hover:bg-slate-50 transition">
                <i data-lucide="refresh-cw" class="w-5 h-5 text-slate-600"></i>
            </button>
        </header>

        <!-- SECTIONS -->

        <!-- A. DASHBOARD SECTION -->
        <div id="dashboard-sec" class="tab-section space-y-8">
            <div class="grid grid-cols-3 gap-8">
                <div class="figma-card p-8 border-t-8 border-red-500 shadow-lg">
                    <p class="text-slate-400 text-xs font-black uppercase">Emergency Cases</p>
                    <h1 id="stat-emg" class="text-5xl font-black text-red-500 mt-2">0</h1>
                </div>
                <div class="figma-card p-8 border-t-8 border-blue-500 shadow-lg">
                    <p class="text-slate-400 text-xs font-black uppercase">New Admissions</p>
                    <h1 id="stat-adm" class="text-5xl font-black text-blue-500 mt-2">0</h1>
                </div>
                <div class="figma-card p-8 border-t-8 border-green-500 shadow-lg">
                    <p class="text-slate-400 text-xs font-black uppercase">Pending Discharges</p>
                    <h1 id="stat-dis" class="text-5xl font-black text-green-500 mt-2">0</h1>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-8">
                <div class="figma-card p-8">
                    <h3 class="font-bold mb-6">Today's Occupancy</h3>
                    <div id="occupancy-reel" class="space-y-4"></div>
                </div>
                <div class="figma-card p-8">
                    <h3 class="font-bold mb-6">Ambulance Status</h3>
                    <div id="fleet-summary-box" class="space-y-4"></div>
                </div>
            </div>
        </div>

        <!-- B. EMERGENCY SECTION -->
        <div id="emergency-sec" class="tab-section hidden">
            <div id="emg-list" class="space-y-4"></div>
        </div>

        <!-- C. WARDS SECTION -->
        <div id="wards-sec" class="tab-section hidden space-y-8">
            <div id="ward-grid-list" class="grid grid-cols-2 gap-6"></div>
        </div>

        <!-- D. ADMISSIONS SECTION -->
        <div id="admissions-sec" class="tab-section hidden">
            <div id="adm-list" class="space-y-4"></div>
        </div>

        <!-- E. REFERRALS SECTION -->
        <div id="referrals-sec" class="tab-section hidden">
            <div id="ref-list" class="space-y-4"></div>
        </div>

        <!-- F. SERVICES SECTION -->
        <div id="services-sec" class="tab-section hidden">
            <div id="serv-reel" class="grid grid-cols-3 gap-4"></div>
        </div>

        <!-- G. RATINGS SECTION -->
        <div id="ratings-sec" class="tab-section hidden">
            <div id="ratings-reel" class="space-y-4"></div>
        </div>

        <!-- H. SETTINGS SECTION -->
        <div id="settings-sec" class="tab-section hidden">
            <div class="figma-card p-8">
                <textarea id="cms-terms" class="w-full h-96 border rounded-2xl p-4"></textarea>
            </div>
        </div>

    </main>

    <!-- BED MODAL -->
    <div id="bed-grid-modal" class="fixed inset-0 modal-backdrop hidden z-[1000] flex items-center justify-center">
        <div class="bg-white w-[600px] rounded-[40px] p-10 relative">
            <button onclick="closeModal()" class="absolute top-6 right-6"><i data-lucide="x"></i></button>
            <div id="bed-master-grid" class="grid grid-cols-6 gap-3"></div>
        </div>
    </div>

    <script>
        const BASE = "http://localhost:5002/hospital/panel";
        const getToken = () => localStorage.getItem('h_token');
        const headers = () => ({ "Authorization": `Bearer ${getToken()}`, "Content-Type": "application/json" });

        async function api(path, method = 'GET', body = null) {
            const config = { method, headers: headers() };
            if(body) config.body = JSON.stringify(body);
            const res = await fetch(`${BASE}${path}`, config);
            return await res.json();
        }

        // TAB SWITCHER
        function switchTab(id, el) {
            document.querySelectorAll('.tab-section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            
            const target = document.getElementById(`${id}-sec`);
            if(target) {
                target.classList.remove('hidden');
                el.classList.add('active');
                document.getElementById('tab-title').innerText = el.innerText.trim();
                
                if(id === 'dashboard') loadStats();
                if(id === 'emergency') loadEmergency();
                if(id === 'wards') loadWards();
                if(id === 'admissions') loadAdmissions();
                if(id === 'referrals') loadReferrals();
                if(id === 'services') loadServices();
                if(id === 'ratings') loadRatings();
                if(id === 'settings') loadSettings();
            }
        }

        // 1. FIXED DASHBOARD STATS (Matches your JSON Response)
        async function loadStats() {
            const res = await api('/dashboard-stats');
            if(res.success) {
                // Key Matching with your JSON: data.emergency, data.upcomingAdmissions, data.todaysDischarges
                document.getElementById('stat-emg').innerText = res.data.emergency || 0;
                document.getElementById('stat-adm').innerText = res.data.upcomingAdmissions || 0;
                document.getElementById('stat-dis').innerText = res.data.todaysDischarges || 0;
            }
            loadFleetSummary();
        }

        // 2. EMERGENCY CASES
        async function loadEmergency() {
            const res = await api('/emergency-cases');
            const container = document.getElementById('emg-list');
            container.innerHTML = res.data.map(item => `
                <div class="figma-card p-6 flex justify-between items-center border-l-8 border-red-500">
                    <div><h4 class="font-bold text-lg">${item.userId?.name || 'Unknown'}</h4><p class="text-xs opacity-50 uppercase">${item.bookingId}</p></div>
                    <button class="bg-red-500 text-white px-4 py-2 rounded-xl text-xs font-bold">Details</button>
                </div>
            `).join('');
        }

        // 3. WARDS
        async function loadWards() {
            const res = await api('/wards/list');
            document.getElementById('ward-grid-list').innerHTML = res.data.map(w => `
                <div class="figma-card p-6">
                    <div class="flex justify-between mb-4">
                        <h4 class="font-bold">${w.name}</h4>
                        <span class="text-green-500 font-bold">${w.availableBeds}/${w.totalBeds} Beds</span>
                    </div>
                    <button onclick="openBedGrid('${w._id}')" class="w-full bg-slate-100 py-2 rounded-xl text-xs font-bold uppercase">View Beds</button>
                </div>
            `).join('');
        }

        async function openBedGrid(wardId) {
            document.getElementById('bed-grid-modal').classList.remove('hidden');
            const res = await api(`/ward/${wardId}/beds`);
            document.getElementById('bed-master-grid').innerHTML = res.data.map(b => `
                <div class="bed-box bed-${b.status}">${b.bedNumber.split('-')[1] || b.bedNumber}</div>
            `).join('');
        }

        // 4. ADMISSIONS
        async function loadAdmissions() {
            const res = await api('/admissions/all');
            document.getElementById('adm-list').innerHTML = res.data.map(a => `
                <div class="figma-card p-6 flex justify-between items-center">
                    <div><h4 class="font-bold">${a.userId?.name}</h4><p class="text-xs opacity-50">${a.bookingId}</p></div>
                    <span class="text-blue-500 font-bold text-xs uppercase">${a.status}</span>
                </div>
            `).join('');
        }

        // 5. REFERRALS
        async function loadReferrals() {
            const res = await api('/referrals/incoming');
            document.getElementById('ref-list').innerHTML = res.data.map(r => `
                <div class="p-4 bg-white border rounded-2xl flex justify-between items-center">
                    <p class="text-sm font-bold">${r.userId?.name}</p>
                    <button class="text-green-600 font-bold text-xs">ACCEPT</button>
                </div>
            `).join('');
        }

        // 6. SERVICES
        async function loadServices() {
            const res = await api('/services');
            document.getElementById('serv-reel').innerHTML = res.data.map(s => `
                <div class="figma-card p-4 text-center">
                    <p class="font-bold">${s.serviceName}</p>
                    <p class="text-green-600 font-bold">₹${s.price}</p>
                </div>
            `).join('');
        }

        // 7. RATINGS
        async function loadRatings() {
            const res = await api('/ratings?targetType=Hospital');
            document.getElementById('ratings-reel').innerHTML = res.data.map(r => `
                <div class="figma-card p-6">
                    <p class="font-bold">${r.userId?.name}</p>
                    <p class="text-slate-500 text-sm italic">"${r.comment}"</p>
                </div>
            `).join('');
        }

        // 8. SETTINGS
        async function loadSettings() {
            const res = await api('/terms');
            document.getElementById('cms-terms').value = res.data;
        }

        // OTHERS
        async function loadFleetSummary() {
            const res = await api('/track-ambulances');
            document.getElementById('fleet-summary-box').innerHTML = res.data.map(amb => `
                <div class="flex justify-between items-center text-xs">
                    <span>${amb.ambulanceCode}</span>
                    <span class="font-bold text-green-600">${amb.status}</span>
                </div>
            `).join('');
        }

        function closeModal() { document.getElementById('bed-grid-modal').classList.add('hidden'); }
        function logout() { localStorage.removeItem('h_token'); location.reload(); }

        lucide.createIcons();
        if(getToken()) loadStats(); else alert("h_token missing in LocalStorage");
    </script>
</body>
</html>
