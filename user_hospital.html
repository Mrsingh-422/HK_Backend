<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Kangaroo - Enterprise Booking v2.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    
    <!-- Flatpickr Range Calendar CDN Files -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #00B377; --brand-light: #E6F7F1; --brand-dark: #008f6d; }
        body { background-color: #0F172A; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #1E293B; }
        .app-shell { width: 390px; height: 844px; background: #F8FAFB; border-radius: 50px; overflow: hidden; position: relative; box-shadow: 0 25px 100px rgba(0,0,0,0.6); border: 10px solid #1E293B; }
        .screen { width: 100%; height: 100%; overflow-y: auto; padding-bottom: 150px; display: none; background: #F8FAFB; }
        .screen.active { display: block; animation: figmaSlide 0.4s ease-out; }
        @keyframes figmaSlide { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .figma-card { background: white; border-radius: 32px; border: 1px solid #F1F5F9; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); }
        .btn-brand { background: var(--brand); color: white; border-radius: 22px; width: 100%; padding: 18px; font-weight: 800; font-size: 14px; transition: 0.3s; border: none; box-shadow: 0 10px 20px rgba(0,179,119,0.2); text-transform: uppercase; }
        .bed-unit { aspect-ratio: 1/1; border-radius: 16px; border: 2.5px solid #F1F5F9; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; transition: 0.2s; background: white; cursor: pointer; }
        .bed-Available { background: #E6F7F1; border-color: #00B377; color: #00B377; }
        .bed-Occupied { background: #FFEBEE !important; border-color: #FF5252 !important; color: #FF5252 !important; opacity: 0.8; cursor: not-allowed; pointer-events: none; }
        .bed-Reserved { background: #FFF3E0; border-color: #FF9800; color: #FF9800; }
        .bed-Maintenance { background: #E2E8F0; border-color: #94A3B8; color: #475569; opacity: 0.6; cursor: not-allowed; pointer-events: none; }
        .bed-selected { background: #00B377 !important; color: white !important; transform: scale(1.05); box-shadow: 0 8px 20px rgba(0,179,119,0.3); border-color: #008f6d !important; }
        .currency-symbol::before { content: '₹'; margin-right: 2px; }
        
        /* Custom Brand Styling for Calendar popup */
        .flatpickr-calendar { border-radius: 24px !important; box-shadow: 0 15px 40px rgba(0,0,0,0.08) !important; border: 1px solid #F1F5F9 !important; font-family: 'Plus Jakarta Sans', sans-serif !important; }
        .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange,
        .flatpickr-day.selected.inRange, .flatpickr-day.startRange.inRange, .flatpickr-day.endRange.inRange,
        .flatpickr-day.selected:focus, .flatpickr-day.startRange:focus, .flatpickr-day.endRange:focus,
        .flatpickr-day.selected:hover, .flatpickr-day.startRange:hover, .flatpickr-day.endRange:hover,
        .flatpickr-day.prevMonthDay.selected, .flatpickr-day.nextMonthDay.selected,
        .flatpickr-day.prevMonthDay.startRange, .flatpickr-day.nextMonthDay.startRange,
        .flatpickr-day.prevMonthDay.endRange, .flatpickr-day.nextMonthDay.endRange {
            background: var(--brand) !important;
            border-color: var(--brand) !important;
            color: white !important;
        }
        .flatpickr-day.inRange {
            background: var(--brand-light) !important;
            border-color: transparent !important;
            box-shadow: none !important;
        }
        
        /* Hide scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <div class="app-shell no-scrollbar">

        <!-- SCREEN 1: HOSPITALS LIST -->
        <div id="screen-list" class="screen active p-6">
            <div class="flex justify-between items-center mb-8">
                <div><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Enterprise</p><h2 class="text-2xl font-black text-slate-800 tracking-tight">Hospitals</h2></div>
                
                <div class="flex gap-2">
                    <button onclick="navigateTo('screen-bookings'); fetchMyBookings('Upcoming')" class="w-12 h-12 rounded-2xl bg-green-50 flex items-center justify-center border border-green-100"><i data-lucide="bookmark" class="text-green-600"></i></button>
                    <button onclick="fetchHospitalsSync()" class="w-12 h-12 rounded-2xl bg-green-50 flex items-center justify-center border border-green-100"><i data-lucide="refresh-cw" class="text-green-600"></i></button>
                </div>
            </div>
            <div id="hosp-list-reel" class="space-y-5"></div>
        </div>

        <!-- SCREEN 2: DETAILS -->
        <div id="screen-details" class="screen">
            <div id="h-hero" class="h-64 relative bg-slate-200 bg-cover bg-center">
                <button onclick="navigateTo('screen-list')" class="absolute top-10 left-6 bg-white/20 backdrop-blur-xl p-3 rounded-2xl text-white shadow-2xl"><i data-lucide="chevron-left"></i></button>
            </div>
            <div class="p-8 -mt-12 bg-white rounded-t-[50px] relative z-10 space-y-8 min-h-[600px]">
                <div id="h-header-box" class="text-center"></div>
                <div class="space-y-4">
                    <h4 class="font-black text-xs text-slate-400 uppercase tracking-[2px]">Ward Facilities</h4>
                    <div id="h-wards-grid" class="grid grid-cols-2 gap-3"></div>
                </div>
            </div>
        </div>

        <!-- SCREEN 3: BED SELECTION -->
        <div id="screen-beds" class="screen p-6 space-y-7">
            <div class="flex items-center gap-4">
                <button onclick="navigateTo('screen-details')" class="p-3 bg-slate-100 rounded-2xl"><i data-lucide="arrow-left" class="w-5 h-5 text-slate-600"></i></button>
                <h2 id="w-title-txt" class="text-2xl font-black text-slate-800 tracking-tighter uppercase">Admission</h2>
            </div>
            
            <div class="figma-card p-6 space-y-5 border-2 border-slate-50">
                <!-- Unified Single Range Calendar Component -->
                <div class="space-y-2">
                    <label class="text-[9px] font-black opacity-40 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i> Select Admission Date Range
                    </label>
                    <div class="relative">
                        <input type="text" id="date-range-picker" placeholder="Tap to select Check-In & Check-Out" class="w-full bg-slate-50 p-4 pl-12 rounded-xl text-[10px] font-black border-none outline-none ring-1 ring-slate-100 cursor-pointer text-slate-800">
                        <i data-lucide="calendar" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <!-- SELECTABLE PATIENT PROFILES -->
                <div class="space-y-2 pt-2">
                    <label class="text-[9px] font-black opacity-40 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="users" class="w-4 h-4 text-slate-400"></i> Choose Patient Bubble
                    </label>
                    <div id="patient-bubbles-container" class="flex gap-2.5 overflow-x-auto py-1 no-scrollbar"></div>
                </div>

                <button onclick="apiCheckGridSync()" class="bg-black text-white w-full py-3 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-xl">Refresh Bed Grid</button>
            </div>

            <div id="bed-master-grid" class="grid grid-cols-4 gap-4"></div>
        </div>

        <!-- SCREEN 4: CHECKOUT -->
        <div id="screen-checkout" class="screen p-8 space-y-8">
            <div class="flex items-center gap-4">
                <button onclick="navigateTo('screen-beds')" class="p-3 bg-slate-100 rounded-2xl"><i data-lucide="arrow-left" class="w-5 h-5 text-slate-600"></i></button>
                <h2 class="text-3xl font-black tracking-tight text-slate-800">Checkout</h2>
            </div>
            
            <div id="checkout-pricing-card" class="bg-white border-2 border-slate-50 p-8 rounded-[40px] space-y-4 shadow-inner">
                <h4 class="font-black text-[10px] text-slate-400 uppercase tracking-[3px] mb-4">Summary</h4>
                <div id="checkout-breakdown-box" class="space-y-3"></div>
            </div>
            
            <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[390px] p-8 bg-white border-t rounded-t-[45px] shadow-2xl z-[200]">
                <div class="flex justify-between items-end mb-6">
                    <div>
                        <p class="text-[9px] text-slate-400 font-black uppercase tracking-widest">Total Amount</p>
                        <h2 id="ui-final-total" class="text-4xl font-black text-green-600 tracking-tighter currency-symbol">0</h2>
                    </div>
                </div>
                <button id="final-book-btn" onclick="apiFinalHospitalBook()" class="btn-brand">Confirm & Book Now</button>
            </div>
        </div>

        <!-- SCREEN 5: MY BOOKINGS SCREEN -->
        <div id="screen-bookings" class="screen p-6 space-y-6">
            <div class="flex items-center gap-4">
                <button onclick="navigateTo('screen-list')" class="p-3 bg-slate-100 rounded-2xl"><i data-lucide="arrow-left" class="w-5 h-5 text-slate-600"></i></button>
                <h2 class="text-2xl font-black text-slate-800 tracking-tighter">My Bookings</h2>
            </div>
            
            <!-- Booking Tabs -->
            <div class="flex bg-slate-100 p-1.5 rounded-2xl gap-1 text-[11px] font-black uppercase text-slate-500">
                <button id="tab-upcoming" onclick="fetchMyBookings('Upcoming')" class="flex-1 py-2.5 rounded-xl text-center">Upcoming</button>
                <button id="tab-pending" onclick="fetchMyBookings('Pending')" class="flex-1 py-2.5 rounded-xl text-center">Pending</button>
                <button id="tab-history" onclick="fetchMyBookings('History')" class="flex-1 py-2.5 rounded-xl text-center">History</button>
            </div>

            <div id="bookings-reel" class="space-y-4"></div>
        </div>

        <!-- SCREEN 6: RESCHEDULE ADMISSION -->
        <div id="screen-reschedule" class="screen p-6 space-y-7">
            <div class="flex items-center gap-4">
                <button onclick="navigateTo('screen-bookings')" class="p-3 bg-slate-100 rounded-2xl"><i data-lucide="arrow-left" class="w-5 h-5 text-slate-600"></i></button>
                <h2 class="text-2xl font-black text-slate-800 tracking-tighter">Reschedule</h2>
            </div>

            <div class="figma-card p-6 space-y-6">
                <div class="space-y-2">
                    <label class="text-[9px] font-black opacity-40 uppercase tracking-wider flex items-center gap-2">
                        <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i> Choose New Dates Range
                    </label>
                    <div class="relative">
                        <input type="text" id="reschedule-picker" placeholder="Select check-in & check-out" class="w-full bg-slate-50 p-4 pl-12 rounded-xl text-[10px] font-black border-none outline-none ring-1 ring-slate-100 cursor-pointer text-slate-800">
                        <i data-lucide="calendar" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>
                <button onclick="apiExecuteReschedule()" class="btn-brand">Confirm Reschedule</button>
            </div>
        </div>

    </div>

    <script>
        const API_ROOT = "http://localhost:5002";
        const PATH = "/user/hospital";
        const getAuthToken = () => localStorage.getItem('token');
        const enterpriseHeaders = () => ({ 
            "Authorization": `Bearer ${getAuthToken()}`, 
            "Content-Type": "application/json" 
        });

        // Date-range state globally managed inside HK_STATE
        let HK_STATE = { hospId: null, wardId: null, bedId: null, pricing: null, startDate: null, endDate: null, selectedPatient: null };

        let reschedulePickerInstance = null;
        let targetRescheduleAppointmentId = null;

        function navigateTo(id) {
            document.querySelectorAll('.screen').forEach(s => { s.classList.remove('active'); s.style.display = 'none'; });
            const target = document.getElementById(id);
            target.style.display = 'block'; target.classList.add('active');
            lucide.createIcons();
        }

        // Initialize dynamic brand calendar on startup
        document.addEventListener("DOMContentLoaded", () => {
            flatpickr("#date-range-picker", {
                mode: "range",
                minDate: "today",
                dateFormat: "Y-m-d",
                onClose: function(selectedDates, dateStr, instance) {
                    if (selectedDates.length === 2) {
                        HK_STATE.startDate = moment(selectedDates[0]).format("YYYY-MM-DD");
                        HK_STATE.endDate = moment(selectedDates[1]).format("YYYY-MM-DD");
                    } else {
                        HK_STATE.startDate = null;
                        HK_STATE.endDate = null;
                    }
                }
            });
            loadPatientProfiles(); // Auto-load profile bubbles
        });

        // Load selective patient profile bubbles
        async function loadPatientProfiles() {
            try {
                const res = await fetch(`${API_ROOT}${PATH}/booking-profiles`, { headers: enterpriseHeaders() });
                const json = await res.json();
                if(json.success && json.data) {
                    document.getElementById('patient-bubbles-container').innerHTML = json.data.map((p, idx) => `
                        <button id="p-bubble-${p.id}" onclick="selectPatientProfile('${p.id}', '${p.name}', ${idx === 0})" class="flex-shrink-0 flex items-center gap-2.5 px-4 py-2.5 bg-white border border-slate-100 rounded-full shadow-sm cursor-pointer transition">
                            <div class="w-7 h-7 bg-green-50 text-green-600 rounded-full flex items-center justify-center font-bold text-[10px] uppercase">${p.name[0]}</div>
                            <div class="text-left">
                                <p class="text-[10px] font-black text-slate-800 leading-none">${p.name}</p>
                                <p class="text-[8px] font-bold text-slate-400 leading-none mt-0.5">${p.relation}</p>
                            </div>
                        </button>
                    `).join('');
                    if(json.data.length > 0) {
                        selectPatientProfile(json.data[0].id, json.data[0].name, true);
                    }
                }
            } catch(e) { console.error(e); }
        }

        function selectPatientProfile(id, name, isMainUser) {
            document.querySelectorAll('#patient-bubbles-container button').forEach(btn => {
                btn.classList.remove('border-green-500', 'bg-green-50/20');
            });
            const bubble = document.getElementById(`p-bubble-${id}`);
            if(bubble) {
                bubble.classList.add('border-green-500', 'bg-green-50/20');
            }
            HK_STATE.selectedPatient = {
                patientName: name,
                patientAge: 30, // Fallback placeholder schemas details
                gender: "Male",
                relation: isMainUser ? "Self" : "Family Member",
                isMainUser: isMainUser
            };
        }

        async function fetchHospitalsSync() {
            try {
                const res = await fetch(`${API_ROOT}${PATH}/list`, { 
                    method: 'POST', 
                    headers: { "Content-Type": "application/json" }, 
                    body: JSON.stringify({ city: "Mohali" }) 
                });
                const json = await res.json();
                if(json.success && json.data) {
                    document.getElementById('hosp-list-reel').innerHTML = json.data.map(h => {
                        const imgUrl = h.hospitalImage && h.hospitalImage[0] ? `${API_ROOT}${h.hospitalImage[0]}` : 'https://images.unsplash.com/photo-1586773860418-d3b31966cfde?auto=format&fit=crop&w=400&q=80';
                        return `
                            <div class="figma-card overflow-hidden">
                                <img src="${imgUrl}" class="h-44 w-full object-cover">
                                <div class="p-6 flex justify-between items-center">
                                    <div><h4 class="font-black text-slate-800">${h.name}</h4><p class="text-[10px] text-slate-400 font-bold uppercase">${h.city}</p></div>
                                    <button onclick="loadHospDetailSync('${h._id}')" class="bg-green-600 text-white px-5 py-2.5 rounded-2xl text-[10px] font-black uppercase tracking-widest">Details</button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch(e) { console.error(e); }
        }

        async function loadHospDetailSync(id) {
            try {
                HK_STATE.hospId = id;
                const res = await fetch(`${API_ROOT}${PATH}/details/${id}`);
                const json = await res.json();
                if(json.success && json.data) {
                    const heroImg = json.data.hospital.hospitalImage && json.data.hospital.hospitalImage[0] ? `${API_ROOT}${json.data.hospital.hospitalImage[0]}` : 'https://images.unsplash.com/photo-1586773860418-d3b31966cfde?auto=format&fit=crop&w=600&q=80';
                    document.getElementById('h-hero').style.backgroundImage = `url('${heroImg}')`;
                    document.getElementById('h-header-box').innerHTML = `<h3 class="text-3xl font-black tracking-tighter text-slate-800 uppercase">${json.data.hospital.name}</h3>`;
                    document.getElementById('h-wards-grid').innerHTML = json.data.wards.map(w => `
                        <button onclick="HK_STATE.wardId='${w._id}'; document.getElementById('w-title-txt').innerText='${w.name}'; navigateTo('screen-beds')" class="bg-white border-2 border-slate-50 p-5 rounded-[28px] text-left">
                            <p class="text-[9px] font-black opacity-30 uppercase">${w.type}</p>
                            <h5 class="font-black text-sm text-slate-800">${w.name}</h5>
                        </button>
                    `).join('');
                    navigateTo('screen-details');
                }
            } catch(e) { console.error(e); }
        }

        async function apiCheckGridSync() {
            const start = HK_STATE.startDate;
            const end = HK_STATE.endDate;
            if(!start || !end) return alert("Kripya Calendar se Check-In aur Check-Out dates dono select karein");

            try {
                const res = await fetch(`${API_ROOT}${PATH}/check-availability`, {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        hospitalId: HK_STATE.hospId,
                        wardId: HK_STATE.wardId,
                        startDate: start,
                        endDate: end
                    })
                });
                const json = await res.json();
                
                if(json.success && json.data) {
                    document.getElementById('bed-master-grid').innerHTML = json.data.map(b => {
                        const bedNum = b.bedNumber.includes('-') ? b.bedNumber.split('-')[1] : b.bedNumber;
                        return `
                            <button id="bed-${b._id}" onclick="selectBed(this, '${b._id}')" class="bed-unit bed-${b.status}">
                                ${bedNum}
                            </button>
                        `;
                    }).join('');
                } else {
                    alert(json.message || "Failed to load availability.");
                }
            } catch(e) {
                console.error(e);
                alert("Error checking bed availability.");
            }
        }

        function selectBed(element, bedId) {
            document.querySelectorAll('.bed-unit').forEach(btn => btn.classList.remove('bed-selected'));
            element.classList.add('bed-selected');
            HK_STATE.bedId = bedId;
            runCheckout();
        }

        async function runCheckout() {
            try {
                const res = await fetch(`${API_ROOT}${PATH}/checkout-summary`, { 
                    method: 'POST', 
                    headers: enterpriseHeaders(), 
                    body: JSON.stringify({ 
                        hospitalId: HK_STATE.hospId, 
                        bedId: HK_STATE.bedId, 
                        startDate: HK_STATE.startDate, 
                        endDate: HK_STATE.endDate 
                    }) 
                });
                const json = await res.json();
                if(json.success && json.data) {
                    HK_STATE.pricing = json.data;
                    document.getElementById('checkout-breakdown-box').innerHTML = `
                        <div class="flex justify-between uppercase text-[10px] font-black"><span>Base Fee (Stay)</span><span>₹${json.data.baseFee || 0}</span></div>
                        <div class="flex justify-between uppercase text-[10px] font-black"><span>Doctor Visit</span><span>₹${json.data.visitCharge || 0}</span></div>
                        <div class="flex justify-between uppercase text-[10px] font-black"><span>Service Surcharge</span><span>₹${json.data.serviceCharge || 0}</span></div>
                        <div class="flex justify-between uppercase text-[10px] font-black"><span>Triage Surcharge</span><span>₹${json.data.triageSurcharge || 0}</span></div>
                        <div class="flex justify-between uppercase text-[10px] font-black"><span>Stay Duration</span><span>${json.data.days || 1} Days</span></div>
                        <div class="flex justify-between uppercase text-[10px] font-black text-red-500"><span>Coupon Discount</span><span>-₹${json.data.discount || 0}</span></div>
                        <div class="flex justify-between uppercase text-xs font-black text-brand pt-2 border-t"><span>Total Payable</span><span>₹${json.data.totalPayable || 0}</span></div>
                    `;
                    document.getElementById('ui-final-total').innerText = json.data.totalPayable || 0;
                    navigateTo('screen-checkout');
                } else { 
                    alert(json.message || "Checkout failed"); 
                }
            } catch(e) { 
                console.error(e); 
            }
        }

        async function apiFinalHospitalBook() {
            const payload = {
                hospitalId: HK_STATE.hospId, 
                bedId: HK_STATE.bedId, 
                startDate: HK_STATE.startDate, 
                endDate: HK_STATE.endDate,
                appointmentDate: HK_STATE.startDate,
                bookingType: 'Admission', 
                triageLevel: 'Routine',
                patients: [HK_STATE.selectedPatient || { patientName: "Rahul Verma", patientAge: 30, gender: "Male", relation: "Self" }],
                pricing: {
                    baseFee: HK_STATE.pricing.baseFee,
                    visitCharges: HK_STATE.pricing.visitCharge,
                    extraCharges: HK_STATE.pricing.serviceCharge + HK_STATE.pricing.triageSurcharge,
                    discountAmount: HK_STATE.pricing.discount || 0,
                    subtotal: HK_STATE.pricing.subtotal,
                    totalPayable: HK_STATE.pricing.totalPayable
                }
            };
            
            try {
                const res = await fetch(`${API_ROOT}${PATH}/book`, { 
                    method: 'POST', 
                    headers: enterpriseHeaders(), 
                    body: JSON.stringify(payload) 
                });
                const json = await res.json();
                if(json.success) { 
                    alert("CONGRATS! Booking Successful. ID: " + json.bookingId); 
                    location.reload(); 
                } else {
                    alert(json.message || "Booking failed.");
                }
            } catch(e) {
                console.error(e);
                alert("Something went wrong during booking.");
            }
        }

        // --- FETCH MY BOOKINGS HISTORY TAB ---
        async function fetchMyBookings(tab) {
            document.querySelectorAll('#screen-bookings button').forEach(btn => {
                if(btn.id.startsWith('tab-')) {
                    btn.className = "flex-1 py-2.5 rounded-xl text-center";
                }
            });
            document.getElementById(`tab-${tab.toLowerCase()}`).className = "flex-1 py-2.5 rounded-xl text-center bg-white text-slate-800 shadow-sm";

            try {
                const res = await fetch(`${API_ROOT}${PATH}/my-bookings?tab=${tab}`, { headers: enterpriseHeaders() });
                const json = await res.json();
                const container = document.getElementById('bookings-reel');
                if(json.success && json.data) {
                    if(json.data.length === 0) {
                        container.innerHTML = `<div class="p-8 text-center text-slate-400 font-bold">No records found.</div>`;
                        return;
                    }
                    container.innerHTML = json.data.map(b => {
                        const imgUrl = b.hospitalId?.hospitalImage && b.hospitalId.hospitalImage[0] ? `${API_ROOT}${b.hospitalId.hospitalImage[0]}` : 'https://images.unsplash.com/photo-1586773860418-d3b31966cfde?auto=format&fit=crop&w=100&q=80';
                        
                        const isReschedulable = b.status === 'Hospital-Pending' || b.status === 'Confirmed';
                        const actionBtn = isReschedulable ? `<button onclick="openRescheduleScreen('${b._id}')" class="w-full bg-slate-800 text-white py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider mt-3">Reschedule Dates</button>` : '';

                        return `
                            <div class="figma-card p-5 space-y-3">
                                <div class="flex gap-4">
                                    <img src="${imgUrl}" class="w-14 h-14 rounded-2xl object-cover">
                                    <div class="flex-1">
                                        <div class="flex justify-between items-start">
                                            <h4 class="font-black text-slate-800 text-sm leading-tight">${b.hospitalId?.name || 'Hospital'}</h4>
                                            <span class="bg-green-50 text-green-700 text-[8px] font-black px-2 py-0.5 rounded-full uppercase">${b.status}</span>
                                        </div>
                                        <p class="text-[9px] font-bold text-slate-400 mt-1 uppercase tracking-wider">ID: ${b.bookingId}</p>
                                        <p class="text-[10px] font-bold text-slate-500 mt-0.5">Stay: ${moment(b.startDate).format("DD MMM")} - ${moment(b.endDate).format("DD MMM")}</p>
                                        <p class="text-[10px] font-bold text-slate-500">Bed: ${b.bedNumber || 'Not Assigned'}</p>
                                    </div>
                                </div>
                                ${actionBtn}
                            </div>
                        `;
                    }).join('');
                }
            } catch(e) { console.error(e); }
        }

        function openRescheduleScreen(appointmentId) {
            targetRescheduleAppointmentId = appointmentId;
            navigateTo('screen-reschedule');
            
            if(!reschedulePickerInstance) {
                reschedulePickerInstance = flatpickr("#reschedule-picker", {
                    mode: "range",
                    minDate: "today",
                    dateFormat: "Y-m-d",
                    onClose: function(selectedDates) {
                        if (selectedDates.length === 2) {
                            HK_STATE.newStart = moment(selectedDates[0]).format("YYYY-MM-DD");
                            HK_STATE.newEnd = moment(selectedDates[1]).format("YYYY-MM-DD");
                        }
                    }
                });
            } else {
                reschedulePickerInstance.clear();
            }
        }

        async function apiExecuteReschedule() {
            if(!HK_STATE.newStart || !HK_STATE.newEnd) return alert("Kripya date range select karein!");
            try {
                const res = await fetch(`${API_ROOT}${PATH}/reschedule`, {
                    method: 'POST',
                    headers: enterpriseHeaders(),
                    body: JSON.stringify({
                        appointmentId: targetRescheduleAppointmentId,
                        newStartDate: HK_STATE.newStart,
                        newEndDate: HK_STATE.newEnd
                    })
                });
                const json = await res.json();
                if(json.success) {
                    alert("Admission Rescheduled Successfully!");
                    fetchMyBookings('Pending');
                    navigateTo('screen-bookings');
                } else {
                    alert(json.message || "Failed to reschedule.");
                }
            } catch(e) { console.error(e); }
        }

        lucide.createIcons();
        if(getAuthToken()) {
            fetchHospitalsSync();
        } else {
            console.log("No token found. Please set localStorage.setItem('token', 'value') for authorization checks.");
            fetchHospitalsSync();
        }
    </script>
</body>
</html>
